<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moritz Peist — CV</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #666666;
      --bg: #ffffff;
      --border: #d9d9d9;
      --accent: #2563eb;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --bg: #121212;
        --border: #333333;
        --accent: #7fb2ff;
        --accent-fg: #0b1526;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 32rem;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: var(--fg);
      background: var(--bg);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .badge {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
    p.subtitle { color: var(--muted); margin: 0; }
    p.location {
      color: var(--muted);
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
    }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0 0;
    }
    .links { display: flex; gap: 0.75rem; margin-top: 2rem; flex-wrap: wrap; }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      color: var(--fg);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .links svg { width: 1rem; height: 1rem; flex-shrink: 0; }
    .flag {
      display: inline-block;
      width: 1.2rem;
      height: 0.9rem;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.35);
      overflow: hidden;
      flex-shrink: 0;
    }
    .flag svg { display: block; width: 100%; height: 100%; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1rem;
    }
    footer a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
    footer a:hover { color: var(--accent); }
    footer svg { width: 1rem; height: 1rem; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">MP</div>
    <h1>Moritz Peist</h1>
  </div>
  <p class="subtitle">Data Science · Finance</p>
  <p class="location">Frankfurt am Main, Germany</p>

  <hr class="divider">

  <div class="links">
    <a href="cv-en.pdf">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 60 30">
          <clipPath id="ukOuter"><rect width="60" height="30"/></clipPath>
          <clipPath id="ukDiag"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#ukOuter)">
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 60,30 M60,0 0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 60,30 M60,0 0,30" clip-path="url(#ukDiag)" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </g>
        </svg>
      </span>
      CV (English)
    </a>
    <a href="cv-de.pdf">
      <span class="flag" aria-hidden="true">
        <svg viewBox="0 0 60 30">
          <rect width="60" height="10" fill="#000"/>
          <rect y="10" width="60" height="10" fill="#DD0000"/>
          <rect y="20" width="60" height="10" fill="#FFCE00"/>
        </svg>
      </span>
      Lebenslauf (Deutsch)
    </a>
  </div>
