#:schema ../metadata.toml.schema.json

# Profile: English (preferred/default). This file holds only public-safe
# data — no email, phone, or street address. Those live in the gitignored
# profile_en/private.toml, overlaid only for local full-PDF builds
# (`typst compile cv.typ --input variant=private`). See private.example.toml.

header_quote = "Data scientist and quantitative analyst bridging central-bank supervision, applied AI research, and finance operations; building production ML pipelines and decision-ready data infrastructure (Python, SQL) from large, messy institutional datasets."

cv_footer = "Curriculum Vitae"

[layout]
    awesome_color = "#173F5C"
    before_section_skip = "-2pt"
    before_entry_skip = "-2pt"
    before_entry_description_skip = "-5pt"
    paper_size = "a4"
    date_width = "5.8cm"

    # Overrides base font size for body text; affects overall density of content
    font_size = "9.4pt"

    [layout.fonts]
        regular_fonts = ["Source Sans 3"]
        header_font = "Roboto"

    [layout.header]
        header_align = "left"
        display_profile_photo = false
        info_font_size = "8pt"

    [layout.entry]
        # No real company logos available/appropriate to bundle — keep entries plain text.
        display_entry_society_first = true
        display_logo = false

    [layout.section]
        title_highlight = "full"

    [layout.footer]
        display_page_counter = true
        display_footer = true

[personal]
    first_name = "Moritz"
    last_name = "Peist"

    [personal.info]
        location = "Frankfurt am Main, Germany"
        # Empty placeholders keep this position in the merge order when
        # profile_en/private.toml overlays real values for the full PDF --
        # see cv.typ's merged-info logic. GitHub/LinkedIn should stay last.
        email = ""
        phone = ""
        github = "m9o8"
        linkedin = "moritz-p"
