#:schema ../metadata.toml.schema.json

# Profil: Deutsch. Nur öffentlich unbedenkliche Daten -- keine E-Mail,
# Telefonnummer oder Adresse. Diese liegen in der (gitignorten)
# profile_de/private.toml und werden nur für den lokalen Vollversions-Build
# eingeblendet (`typst compile cv.typ --input profile=de --input variant=private`).
# Siehe private.example.toml.

cv_footer = "Lebenslauf"

[layout]
    awesome_color = "#173F5C"
    before_section_skip = "1pt"
    before_entry_skip = "1pt"
    before_entry_description_skip = "1pt"
    paper_size = "a4"
    date_width = "5.8cm"

    [layout.fonts]
        regular_fonts = ["Source Sans 3"]
        header_font = "Roboto"

    [layout.header]
        header_align = "left"
        display_profile_photo = false
        info_font_size = "10pt"

    [layout.entry]
        display_entry_society_first = true
        display_logo = false

    [layout.section]
        title_highlight = "full"

    [layout.footer]
        display_page_counter = true
        display_footer = true

[personal]
    first_name = "Moritz"
    last_name = "Peist"

    [personal.info]
        github = "m9o8"
        linkedin = "moritz-p"
        location = "Frankfurt am Main, Deutschland"
